<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DEBRYNE PENALTY V3</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#020604;
    color:white;
    overflow:hidden;
    touch-action:manipulation;
}

.game{
    width:100%;
    max-width:520px;
    height:100vh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#075b29;
}

/* =========================
   START SCREEN
========================= */

.start{
    position:absolute;
    inset:0;
    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:25px;

    background:
    linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.86)),
    radial-gradient(circle at 50% 30%,#168d43,#03170b);
}

.start-box{
    width:100%;
    max-width:390px;
}

.logo{
    font-size:43px;
    font-weight:1000;
    letter-spacing:2px;
}

.logo span{
    color:#ffd21a;
}

.version{
    margin-top:7px;
    color:#aaa;
    font-size:11px;
    letter-spacing:4px;
}

.start-box h2{
    margin-top:45px;
    font-size:22px;
}

.start-box p{
    color:#bbb;
    font-size:13px;
    line-height:1.6;
    margin:12px 0 25px;
}

.difficulty{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.diff{
    flex:1;
    padding:12px 5px;
    border:1px solid rgba(255,255,255,.25);
    background:#17241c;
    color:white;
    border-radius:10px;
    font-weight:bold;
}

.diff.active{
    background:#ffd21a;
    color:#111;
}

.start-btn{
    width:100%;
    padding:17px;
    border:0;
    border-radius:13px;
    background:#ffd21a;
    color:#111;
    font-size:18px;
    font-weight:900;
    box-shadow:0 5px 0 #9f8000;
}

.start-btn:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #9f8000;
}

/* =========================
   HEADER
========================= */

.header{
    position:absolute;
    top:0;
    width:100%;
    height:70px;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    background:rgba(0,0,0,.46);
}

.brand{
    font-size:17px;
    font-weight:900;
}

.brand span{
    color:#ffd21a;
}

.stats{
    display:flex;
    gap:18px;
    text-align:center;
}

.stat small{
    display:block;
    color:#aaa;
    font-size:8px;
    letter-spacing:1px;
}

.stat strong{
    font-size:20px;
}

/* =========================
   STADIUM
========================= */

.stadium{
    position:absolute;
    inset:0;
    padding-top:70px;

    background:
    linear-gradient(
        to bottom,
        #26322c 0,
        #111914 18%,
        #08722f 40%,
        #064c23 100%
    );
}

.crowd{
    position:absolute;
    top:70px;
    width:100%;
    height:110px;

    background:
    radial-gradient(circle,#aaa 1px,transparent 2px),
    radial-gradient(circle,#555 1px,transparent 2px),
    #18211c;

    background-size:13px 13px,17px 17px;
}

.field{
    position:absolute;
    top:180px;
    bottom:0;
    width:100%;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 45px,
        transparent 45px,
        transparent 90px
    ),
    linear-gradient(#08772f,#064d23);
}

/* =========================
   GOAL
========================= */

.goal{
    position:absolute;
    top:115px;
    left:50%;
    transform:translateX(-50%);

    width:315px;
    height:190px;

    border:7px solid white;
    border-bottom:0;

    background:
    repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 23px,
        rgba(255,255,255,.25) 24px,
        transparent 25px
    ),
    repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 23px,
        rgba(255,255,255,.25) 24px,
        transparent 25px
    );

    box-shadow:0 10px 30px rgba(0,0,0,.45);

    z-index:5;
}

/* =========================
   KEEPER
========================= */

.keeper{
    position:absolute;

    top:153px;
    left:50%;

    width:72px;
    height:125px;

    transform:translateX(-50%);

    z-index:12;

    transition:
    transform .55s cubic-bezier(.2,.8,.2,1);
}

.head{
    width:30px;
    height:30px;
    margin:auto;
    border-radius:50%;
    background:#8d5524;
}

.body{
    width:50px;
    height:57px;
    margin:auto;
    background:#1264ce;
    border-radius:12px 12px 6px 6px;
}

.arm{
    position:absolute;
    top:31px;
    width:16px;
    height:55px;
    background:#1264ce;
    border-radius:12px;
}

.arm.left{
    left:2px;
    transform:rotate(24deg);
}

.arm.right{
    right:2px;
    transform:rotate(-24deg);
}

.leg{
    position:absolute;
    top:83px;
    width:17px;
    height:43px;
    background:#111;
    border-radius:10px;
}

.leg.left{
    left:18px;
}

.leg.right{
    right:18px;
}

.keeper.left{
    transform:translateX(-135px) rotate(-38deg);
}

.keeper.right{
    transform:translateX(65px) rotate(38deg);
}

.keeper.center{
    transform:translateX(-50%) scale(1.1);
}

/* =========================
   BALL
========================= */

.ball{
    position:absolute;

    width:50px;
    height:50px;

    left:50%;
    bottom:160px;

    transform:translateX(-50%);

    z-index:20;

    transition:
    left .65s cubic-bezier(.15,.8,.2,1),
    bottom .65s cubic-bezier(.15,.8,.2,1),
    transform .65s;
}

.ball::after{
    content:"⚽";
    font-size:50px;
    line-height:50px;
}

/* =========================
   AIMING AREA
========================= */

.aim-title{
    position:absolute;
    bottom:290px;
    width:100%;
    text-align:center;
    font-size:11px;
    color:#ddd;
    letter-spacing:1px;
    z-index:30;
}

.aim{
    position:absolute;
    left:50%;
    bottom:220px;

    transform:translateX(-50%);

    width:270px;
    height:80px;

    display:flex;
    justify-content:space-between;

    z-index:30;
}

.target{
    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.65);

    background:rgba(0,0,0,.3);

    color:white;

    font-size:27px;

    transition:.2s;
}

.target.active{
    background:#ffd21a;
    color:#111;
    border-color:white;
    transform:scale(1.12);
}

/* =========================
   POWER
========================= */

.power{
    position:absolute;

    bottom:175px;
    left:50%;

    transform:translateX(-50%);

    width:250px;

    z-index:30;
}

.power-label{
    text-align:center;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.power-bar{
    height:13px;
    background:#171717;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.4);
}

.power-fill{
    height:100%;
    width:60%;
    background:#ffd21a;
}

/* =========================
   SHOOT
========================= */

.shoot{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    padding:16px;

    border:0;
    border-radius:14px;

    background:#ffd21a;
    color:#111;

    font-size:17px;
    font-weight:900;

    z-index:40;

    box-shadow:0 5px 0 #a07e00;
}

.shoot:active{
    transform:translateX(-50%) translateY(4px);
    box-shadow:0 1px 0 #a07e00;
}

/* =========================
   MESSAGE
========================= */

.message{
    position:absolute;

    top:325px;
    left:50%;

    transform:translateX(-50%);

    z-index:60;

    font-size:34px;
    font-weight:1000;

    text-shadow:0 4px 10px #000;

    opacity:0;

    transition:.2s;
}

.message.show{
    opacity:1;
}

.goal-msg{
    color:#00ff6a;
}

.save-msg{
    color:#ff4444;
}

/* =========================
   RESULT
========================= */

.result{
    position:absolute;
    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    text-align:center;

    background:rgba(0,0,0,.86);
}

.result.show{
    display:flex;
}

.result-box{
    width:100%;
    max-width:350px;

    padding:30px 25px;

    border-radius:22px;

    background:#102019;

    border:1px solid rgba(255,255,255,.15);
}

.result-box h1{
    font-size:28px;
}

.final-score{
    margin:18px 0;
    font-size:58px;
    font-weight:1000;
    color:#ffd21a;
}

.result-info{
    color:#aaa;
    margin-bottom:23px;
}

.again{
    width:100%;
    padding:16px;

    border:0;
    border-radius:12px;

    background:#ffd21a;
    color:#111;

    font-size:16px;
    font-weight:900;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-height:650px){

    .goal{
        top:95px;
        height:160px;
    }

    .keeper{
        top:130px;
    }

    .aim-title{
        bottom:255px;
    }

    .aim{
        bottom:190px;
    }

    .power{
        bottom:145px;
    }

    .shoot{
        bottom:15px;
    }

    .ball{
        bottom:135px;
    }
}
</style>
</head>

<body>

<div class="game">

<!-- START SCREEN -->

<div class="start" id="startScreen">

    <div class="start-box">

        <div class="logo">
            DEBRYNE <span>PENALTY</span>
        </div>

        <div class="version">
            V3 • PENALTY SHOOTOUT
        </div>

        <h2>⚽ Beat the goalkeeper</h2>

        <p>
            Choose your target, control your power
            and score as many penalties as possible.
        </p>

        <div class="difficulty">

            <button
                class="diff"
                id="easy"
                onclick="setDifficulty('easy')">
                EASY
            </button>

            <button
                class="diff active"
                id="normal"
                onclick="setDifficulty('normal')">
                NORMAL
            </button>

            <button
                class="diff"
                id="hard"
                onclick="setDifficulty('hard')">
                HARD
            </button>

        </div>

        <button
            class="start-btn"
            onclick="startGame()">

            START SHOOTOUT

        </button>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <div class="brand">
        DEBRYNE <span>PENALTY</span>
    </div>

    <div class="stats">

        <div class="stat">
            <small>GOALS</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>ROUND</small>
            <strong>
                <span id="round">1</span>/5
            </strong>
        </div>

    </div>

</div>


<!-- STADIUM -->

<div class="stadium">

    <div class="crowd"></div>

    <div class="field"></div>

    <div class="goal"></div>


    <!-- GOALKEEPER -->

    <div class="keeper" id="keeper">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>


    <!-- BALL -->

    <div class="ball" id="ball"></div>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message">
    </div>


    <!-- AIM -->

    <div class="aim-title">
        CHOOSE YOUR TARGET
    </div>

    <div class="aim">

        <button
            class="target"
            id="leftTarget"
            onclick="chooseTarget('left')">
            ↖
        </button>

        <button
            class="target active"
            id="centerTarget"
            onclick="chooseTarget('center')">
            ↑
        </button>

        <button
            class="target"
            id="rightTarget"
            onclick="chooseTarget('right')">
            ↗
        </button>

    </div>


    <!-- POWER -->

    <div class="power">

        <div class="power-label">
            SHOOTING POWER
        </div>

        <div class="power-bar">

            <div
                class="power-fill"
                id="powerFill">
            </div>

        </div>

    </div>


    <!-- SHOOT -->

    <button
        class="shoot"
        id="shootButton"
        onclick="shoot()">

        ⚡ SHOOT

    </button>

</div>


<!-- RESULT -->

<div
    class="result"
    id="result">

    <div class="result-box">

        <h1>
            🏆 SHOOTOUT COMPLETE
        </h1>

        <div class="final-score">
            <span id="finalScore">0</span>/5
        </div>

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <button
            class="again"
            onclick="playAgain()">

            PLAY AGAIN

        </button>

    </div>

</div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let round = 1;

let target = "center";

let power = 60;

let powerDirection = 1;

let shooting = false;

let difficulty = "normal";

let powerTimer;


/* =========================
   ELEMENTS
========================= */

const startScreen =
document.getElementById("startScreen");

const keeper =
document.getElementById("keeper");

const ball =
document.getElementById("ball");

const message =
document.getElementById("message");

const scoreDisplay =
document.getElementById("score");

const roundDisplay =
document.getElementById("round");

const powerFill =
document.getElementById("powerFill");

const shootButton =
document.getElementById("shootButton");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const resultInfo =
document.getElementById("resultInfo");


/* =========================
   DIFFICULTY
========================= */

function setDifficulty(level){

    difficulty = level;

    document
    .querySelectorAll(".diff")
    .forEach(button => {
        button.classList.remove("active");
    });

    document
    .getElementById(level)
    .classList.add("active");
}


/* =========================
   START
========================= */

function startGame(){

    startScreen.style.display = "none";

    resetGame();

    startPower();

}


/* =========================
   POWER SYSTEM
========================= */

function startPower(){

    clearInterval(powerTimer);

    powerTimer = setInterval(() => {

        power += powerDirection * 2;

        if(power >= 100){

            power = 100;

            powerDirection = -1;

        }

        if(power <= 20){

            power = 20;

            powerDirection = 1;

        }

        powerFill.style.width =
        power + "%";

    },40);
}


/* =========================
   TARGET
========================= */

function chooseTarget(direction){

    if(shooting) return;

    target = direction;

    document
    .getElementById("leftTarget")
    .classList.remove("active");

    document
    .getElementById("centerTarget")
    .classList.remove("active");

    document
    .getElementById("rightTarget")
    .classList.remove("active");

    document
    .getElementById(direction+"Target")
    .classList.add("active");
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(shooting) return;

    shooting = true;

    clearInterval(powerTimer);

    shootButton.disabled = true;


    /* goalkeeper reaction */

    const directions =
    ["left","center","right"];

    let keeperDirection;


    /*
       Difficulty changes goalkeeper
       behaviour.
    */

    if(difficulty === "easy"){

        /*
           Easy:
           goalkeeper has a higher
           chance of choosing center.
        */

        const random =
        Math.random();

        if(random < .55){

            keeperDirection = "center";

        }else{

            keeperDirection =
            directions[
                Math.floor(
                    Math.random()*3
                )
            ];

        }

    }else if(difficulty === "hard"){

        /*
           Hard:
           goalkeeper has a better
           chance of guessing.
        */

        if(Math.random() < .45){

            keeperDirection = target;

        }else{

            keeperDirection =
            directions[
                Math.floor(
                    Math.random()*3
                )
            ];

        }

    }else{

        keeperDirection =
        directions[
            Math.floor(
                Math.random()*3
            )
        ];

    }


    /* goalkeeper animation */

    keeper.className = "keeper";

    if(keeperDirection === "left"){

        keeper.classList.add("left");

    }

    if(keeperDirection === "right"){

        keeper.classList.add("right");

    }

    if(keeperDirection === "center"){

        keeper.classList.add("center");

    }


    /* ball animation */

    if(target === "left"){

        ball.style.left = "30%";

    }else if(target === "right"){

        ball.style.left = "70%";

    }else{

        ball.style.left = "50%";

    }


    /*
       Power affects ball height.
    */

    ball.style.bottom =
    (350 + power * .55) + "px";

    ball.style.transform =
    "translateX(-50%) scale(.55) rotate(500deg)";


    setTimeout(() => {

        /*
           Stronger shots have a small
           chance to beat a goalkeeper
           even when he guesses correctly.
        */

        let saved =
        target === keeperDirection;

        if(
            saved &&
            power >= 90 &&
            Math.random() < .28
        ){

            saved = false;

        }


        if(saved){

            showMessage(
                "🧤 SAVED!",
                false
            );

        }else{

            score++;

            scoreDisplay.textContent =
            score;

            showMessage(
                "⚽ GOAL!",
                true
            );

        }

    },650);


    setTimeout(() => {

        if(round >= 5){

            finishGame();

        }else{

            nextRound();

        }

    },1650);

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,isGoal){

    message.textContent = text;

    message.className =
    "message show " +
    (isGoal
        ? "goal-msg"
        : "save-msg");
}


/* =========================
   NEXT ROUND
========================= */

function nextRound(){

    round++;

    roundDisplay.textContent =
    round;

    ball.style.left = "50%";

    ball.style.bottom = "160px";

    ball.style.transform =
    "translateX(-50%)";

    keeper.className =
    "keeper";

    message.className =
    "message";


    target = "center";


    document
    .querySelectorAll(".target")
    .forEach(button => {
        button.classList.remove("active");
    });

    document
    .getElementById("centerTarget")
    .classList.add("active");


    power = 60;

    powerDirection = 1;

    powerFill.style.width =
    "60%";


    shooting = false;

    shootButton.disabled =
    false;

    startPower();

}


/* =========================
   FINISH
========================= */

function finishGame(){

    clearInterval(powerTimer);

    finalScore.textContent =
    score;

    if(score === 5){

        resultInfo.textContent =
        "🔥 PERFECT! You scored every penalty.";

    }else if(score >= 3){

        resultInfo.textContent =
        "⚽ Excellent shootout. You found the net.";

    }else if(score > 0){

        resultInfo.textContent =
        "👏 You scored, but the goalkeeper made some big saves.";

    }else{

        resultInfo.textContent =
        "🧤 The goalkeeper dominated this shootout.";

    }

    result.classList.add("show");
}


/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

    result.classList.remove("show");

    resetGame();

    startPower();
}


/* =========================
   RESET
========================= */

function resetGame(){

    score = 0;

    round = 1;

    target = "center";

    power = 60;

    powerDirection = 1;

    shooting = false;


    scoreDisplay.textContent =
    "0";

    roundDisplay.textContent =
    "1";


    powerFill.style.width =
    "60%";


    ball.style.left =
    "50%";

    ball.style.bottom =
    "160px";

    ball.style.transform =
    "translateX(-50%)";


    keeper.className =
    "keeper";

    message.className =
    "message";


    shootButton.disabled =
    false;


    document
    .querySelectorAll(".target")
    .forEach(button => {
        button.classList.remove("active");
    });


    document
    .getElementById("centerTarget")
    .classList.add("active");

}

</script>

</body>
</html>
