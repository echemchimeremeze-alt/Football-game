<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEBRYNE PENALTY V5</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  touch-action:none;
}

.game{
  width:100%;
  max-width:520px;
  height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#07150e;
}

/* =========================
   START SCREEN
========================= */

.start{
  position:absolute;
  inset:0;
  z-index:500;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.9)),
    radial-gradient(circle at 50% 20%,#155e38,#020503 75%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.startBox{
  width:100%;
  max-width:390px;
  text-align:center;
}

.gameLogo{
  font-size:40px;
  font-weight:1000;
  letter-spacing:-2px;
}

.gameLogo span{
  color:#21e879;
}

.edition{
  font-size:10px;
  color:#aaa;
  letter-spacing:4px;
  margin-top:6px;
}

.playerCard{
  margin:28px auto 20px;
  width:270px;
  height:145px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#111;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 15px 40px rgba(0,0,0,.7);
}

.playerCard img{
  position:absolute;
  right:0;
  bottom:0;
  width:57%;
  height:135%;
  object-fit:cover;
  object-position:center top;
}

.cardShade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,#07130d 0%,rgba(7,19,13,.9) 40%,transparent 80%);
}

.cardInfo{
  position:absolute;
  left:18px;
  top:27px;
  text-align:left;
}

.cardInfo small{
  color:#21e879;
  font-size:10px;
  font-weight:bold;
}

.cardInfo h2{
  font-size:27px;
  margin-top:4px;
}

.cardInfo p{
  color:#aaa;
  font-size:11px;
  margin-top:5px;
}

.startText{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

.startBtn{
  width:100%;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#21e879;
  color:#031008;
  font-size:17px;
  font-weight:1000;
  box-shadow:0 5px 0 #08783c;
}

/* =========================
   GAME HUD
========================= */

.hud{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:74px;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 13px;

  background:linear-gradient(
    rgba(0,0,0,.9),
    rgba(0,0,0,.35)
  );
}

.hudTeam{
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:39px;
  height:39px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #21e879;
  background:#222;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
}

.teamText small{
  display:block;
  color:#999;
  font-size:8px;
}

.teamText strong{
  font-size:12px;
}

.scoreBox{
  text-align:center;
}

.scoreBox small{
  display:block;
  color:#999;
  font-size:7px;
}

.score{
  font-size:24px;
  font-weight:1000;
}

.round{
  text-align:right;
}

.round small{
  display:block;
  color:#999;
  font-size:7px;
}

.round strong{
  font-size:13px;
}

/* =========================
   STADIUM
========================= */

.stadium{
  position:absolute;
  inset:0;
  background:#06120b;
}

.sky{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:48%;
  background:
    radial-gradient(circle at 50% 15%,#526c69,#172421 45%,#050908);
}

.lights{
  position:absolute;
  top:67px;
  left:0;
  width:100%;
  height:75px;

  background:
    radial-gradient(circle at 10% 30%,rgba(255,255,220,.95) 0 3px,transparent 4px),
    radial-gradient(circle at 20% 45%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 30% 25%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 40% 42%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 50% 20%,rgba(255,255,220,.95) 0 3px,transparent 4px),
    radial-gradient(circle at 60% 40%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 70% 25%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 80% 43%,rgba(255,255,220,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 90% 28%,rgba(255,255,220,.9) 0 3px,transparent 4px);
  filter:blur(.3px);
}

.crowd{
  position:absolute;
  top:120px;
  left:0;
  width:100%;
  height:155px;

  background:
    radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 2px),
    radial-gradient(circle,rgba(80,150,120,.7) 1px,transparent 2px),
    #101a16;

  background-size:9px 9px,13px 13px;
  opacity:.9;
}

.field{
  position:absolute;
  top:260px;
  left:-15%;
  width:130%;
  height:75%;
  transform:perspective(500px) rotateX(17deg);
  transform-origin:top;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0 45px,
      transparent 45px 90px
    ),
    linear-gradient(#087334,#034a21);
}

/* =========================
   GOAL
========================= */

.goal{
  position:absolute;
  top:180px;
  left:50%;
  transform:translateX(-50%);
  width:340px;
  height:190px;
  z-index:15;

  border:7px solid white;
  border-bottom:0;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 22px,
      rgba(255,255,255,.16) 23px 24px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 22px,
      rgba(255,255,255,.16) 23px 24px
    );

  box-shadow:
    0 0 20px rgba(255,255,255,.15),
    0 20px 35px rgba(0,0,0,.5);
}

/* =========================
   GOAL TARGET
========================= */

.target{
  position:absolute;
  top:188px;
  left:50%;
  transform:translateX(-50%);
  width:320px;
  height:180px;
  z-index:25;
}

.crosshair{
  position:absolute;
  width:38px;
  height:38px;
  border:2px solid #21e879;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 18px rgba(33,232,121,.8);
  pointer-events:none;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#21e879;
}

.crosshair:before{
  width:52px;
  height:1px;
  left:-9px;
  top:17px;
}

.crosshair:after{
  height:52px;
  width:1px;
  top:-9px;
  left:17px;
}

/* =========================
   GOALKEEPER
========================= */

.keeper{
  position:absolute;
  top:208px;
  left:50%;
  width:78px;
  height:150px;
  transform:translateX(-50%);
  z-index:22;

  transition:
    transform .6s cubic-bezier(.2,.8,.2,1);
}

.keeperPhoto{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:70px;
  height:125px;
  overflow:hidden;
  border-radius:45px 45px 15px 15px;
}

.keeperPhoto img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  filter:saturate(1.15);
}

.keeperBody{
  position:absolute;
  top:90px;
  left:14px;
  width:50px;
  height:58px;
  background:#ce1836;
  border-radius:13px;
  border:2px solid rgba(255,255,255,.2);
}

.keeper.diveLeft{
  transform:translateX(-135px) rotate(-28deg);
}

.keeper.diveRight{
  transform:translateX(65px) rotate(28deg);
}

.keeper.diveCenter{
  transform:translateX(-50%) scale(1.12);
}

/* =========================
   BALL
========================= */

.ball{
  position:absolute;
  left:50%;
  bottom:125px;
  width:46px;
  height:46px;
  z-index:40;
  transform:translateX(-50%);
  transition:
    left .7s cubic-bezier(.15,.8,.2,1),
    bottom .7s cubic-bezier(.15,.8,.2,1),
    transform .7s;
}

.ball:after{
  content:"⚽";
  font-size:46px;
}

/* =========================
   PLAYER PANEL
========================= */

.playerPanel{
  position:absolute;
  bottom:12px;
  left:12px;
  z-index:80;

  width:170px;
  height:67px;

  display:flex;
  align-items:center;
  gap:9px;

  padding:7px;

  border-radius:12px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
}

.playerPanel img{
  width:52px;
  height:52px;
  border-radius:8px;
  object-fit:cover;
  object-position:center top;
}

.playerPanel small{
  color:#21e879;
  font-size:8px;
}

.playerPanel strong{
  display:block;
  font-size:13px;
}

.playerPanel span{
  color:#999;
  font-size:9px;
}

/* =========================
   POWER
========================= */

.powerBox{
  position:absolute;
  bottom:22px;
  right:12px;
  z-index:90;
  width:150px;
}

.powerLabel{
  font-size:8px;
  color:#aaa;
  text-align:center;
  margin-bottom:5px;
  letter-spacing:2px;
}

.powerBar{
  width:100%;
  height:13px;
  border-radius:20px;
  background:#111;
  border:1px solid rgba(255,255,255,.25);
  overflow:hidden;
}

.powerFill{
  height:100%;
  width:60%;
  background:linear-gradient(
    90deg,
    #21e879,
    #f4dd32,
    #ff3838
  );
}

/* =========================
   SHOOT BUTTON
========================= */

.shoot{
  position:absolute;
  bottom:95px;
  right:25px;
  z-index:95;

  width:105px;
  height:105px;

  border-radius:50%;

  border:5px solid rgba(255,255,255,.7);

  background:
    radial-gradient(circle,#28ed80,#087d40);

  color:white;

  font-size:15px;
  font-weight:1000;

  box-shadow:
    0 0 0 5px rgba(33,232,121,.15),
    0 10px 25px rgba(0,0,0,.6);
}

.shoot:active{
  transform:scale(.94);
}

.shoot:disabled{
  opacity:.45;
}

/* =========================
   MESSAGE
========================= */

.message{
  position:absolute;
  top:410px;
  left:50%;
  transform:translateX(-50%) scale(.7);
  z-index:150;

  font-size:38px;
  font-weight:1000;

  opacity:0;
  transition:.25s;

  text-shadow:0 4px 15px #000;
}

.message.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

.goalMsg{
  color:#21e879;
}

.saveMsg{
  color:#ff3c55;
}

/* =========================
   RESULT
========================= */

.result{
  position:absolute;
  inset:0;
  z-index:600;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.94)),
    #07140d;
}

.result.show{
  display:flex;
}

.resultBox{
  width:100%;
  max-width:360px;
  text-align:center;
  background:#0e1b14;
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  padding:28px 22px;
}

.resultBox h1{
  font-size:23px;
}

.bigScore{
  font-size:65px;
  font-weight:1000;
  color:#21e879;
  margin:15px 0;
}

.resultBox p{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

.again{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#21e879;
  font-weight:1000;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-height:680px){

  .goal{
    top:145px;
    height:165px;
  }

  .target{
    top:153px;
    height:155px;
  }

  .keeper{
    top:170px;
  }

  .message{
    top:350px;
  }

  .playerPanel{
    bottom:7px;
  }

  .powerBox{
    bottom:17px;
  }

  .shoot{
    bottom:82px;
  }

}
</style>
</head>

<body>

<div class="game">

<!-- ================= START ================= -->

<div class="start" id="start">

  <div class="startBox">

    <div class="gameLogo">
      DEBRYNE <span>PENALTY</span>
    </div>

    <div class="edition">
      V5 • PRO SHOOTOUT
    </div>

    <div class="playerCard">

      <img
        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cole_Palmer_20042025_(2).jpg"
        alt="Cole Palmer">

      <div class="cardShade"></div>

      <div class="cardInfo">
        <small>CHELSEA FC</small>
        <h2>PALMER</h2>
        <p>RIGHT FOOT • PENALTY</p>
      </div>

    </div>

    <div class="startText">
      Step up from the spot.<br>
      Choose your target. Control your power.
      Beat the goalkeeper.
    </div>

    <button
      class="startBtn"
      onclick="startGame()">
      ⚽ START MATCH
    </button>

  </div>

</div>


<!-- ================= HUD ================= -->

<div class="hud">

  <div class="hudTeam">

    <div class="avatar">
      <img
        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cole_Palmer_20042025_(2).jpg">
    </div>

    <div class="teamText">
      <small>TAKER</small>
      <strong>PALMER</strong>
    </div>

  </div>


  <div class="scoreBox">
    <small>PENALTY SHOOTOUT</small>
    <div class="score">
      <span id="score">0</span>
    </div>
  </div>


  <div class="round">
    <small>ATTEMPT</small>
    <strong>
      <span id="round">1</span>/5
    </strong>
  </div>

</div>


<!-- ================= STADIUM ================= -->

<div class="stadium">

  <div class="sky"></div>

  <div class="lights"></div>

  <div class="crowd"></div>

  <div class="field"></div>


  <!-- GOAL -->

  <div class="goal"></div>


  <!-- AIM -->

  <div
    class="target"
    id="target">

    <div
      class="crosshair"
      id="crosshair">
    </div>

  </div>


  <!-- KEEPER -->

  <div
    class="keeper"
    id="keeper">

    <div class="keeperPhoto">

      <img
        src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Weverton_Palmeiras_2025_07_05_Chelsea.jpg"
        alt="Goalkeeper">

    </div>

    <div class="keeperBody"></div>

  </div>


  <!-- BALL -->

  <div
    class="ball"
    id="ball">
  </div>


  <!-- PLAYER PANEL -->

  <div class="playerPanel">

    <img
      src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cole_Palmer_20042025_(2).jpg">

    <div>
      <small>TAKING PENALTY</small>
      <strong>COLE PALMER</strong>
      <span>CHELSEA • #10</span>
    </div>

  </div>


  <!-- POWER -->

  <div class="powerBox">

    <div class="powerLabel">
      POWER
    </div>

    <div class="powerBar">

      <div
        class="powerFill"
        id="powerFill">
      </div>

    </div>

  </div>


  <!-- SHOOT -->

  <button
    class="shoot"
    id="shoot"
    onclick="shoot()">

    SHOOT

  </button>


  <!-- MESSAGE -->

  <div
    class="message"
    id="message">
  </div>

</div>


<!-- ================= RESULT ================= -->

<div
  class="result"
  id="result">

  <div class="resultBox">

    <h1>
      FULL TIME
    </h1>

    <div class="bigScore">
      <span id="finalScore">0</span>/5
    </div>

    <p id="resultText"></p>

    <button
      class="again"
      onclick="playAgain()">

      PLAY AGAIN

    </button>

  </div>

</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let score = 0;
let round = 1;

let power = 60;
let powerDirection = 1;

let shooting = false;
let dragging = false;

let aimX = 50;
let aimY = 50;

let powerTimer;

const start =
document.getElementById("start");

const target =
document.getElementById("target");

const crosshair =
document.getElementById("crosshair");

const keeper =
document.getElementById("keeper");

const ball =
document.getElementById("ball");

const shootButton =
document.getElementById("shoot");

const powerFill =
document.getElementById("powerFill");

const message =
document.getElementById("message");

const scoreEl =
document.getElementById("score");

const roundEl =
document.getElementById("round");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const resultText =
document.getElementById("resultText");


/* =========================
   START
========================= */

function startGame(){

  start.style.display="none";

  reset();

  startPower();

}


/* =========================
   POWER
========================= */

function startPower(){

  clearInterval(powerTimer);

  powerTimer=setInterval(()=>{

    power += powerDirection*2;

    if(power>=100){

      power=100;
      powerDirection=-1;

    }

    if(power<=20){

      power=20;
      powerDirection=1;

    }

    powerFill.style.width=
      power+"%";

  },45);

}


/* =========================
   AIM
========================= */

function updateAim(x,y){

  const rect=
    target.getBoundingClientRect();

  let px=
    ((x-rect.left)/rect.width)*100;

  let py=
    ((y-rect.top)/rect.height)*100;

  px=Math.max(5,Math.min(95,px));
  py=Math.max(5,Math.min(95,py));

  aimX=px;
  aimY=py;

  crosshair.style.left=
    px+"%";

  crosshair.style.top=
    py+"%";

}


/* =========================
   TOUCH
========================= */

target.addEventListener(
  "touchstart",
  e=>{

    if(shooting)return;

    dragging=true;

    const t=e.touches[0];

    updateAim(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


target.addEventListener(
  "touchmove",
  e=>{

    if(!dragging || shooting)return;

    e.preventDefault();

    const t=e.touches[0];

    updateAim(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


target.addEventListener(
  "touchend",
  ()=>{
    dragging=false;
  }
);


/* =========================
   MOUSE
========================= */

target.addEventListener(
  "mousedown",
  e=>{

    if(shooting)return;

    dragging=true;

    updateAim(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mousemove",
  e=>{

    if(!dragging || shooting)return;

    updateAim(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mouseup",
  ()=>{
    dragging=false;
  }
);


/* =========================
   SOUND
========================= */

let audioCtx;

function sound(type){

  try{

    if(!audioCtx){

      audioCtx=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.connect(gain);
    gain.connect(
      audioCtx.destination
    );

    if(type==="kick"){

      osc.frequency.value=110;

    }

    if(type==="goal"){

      osc.frequency.value=650;

    }

    if(type==="save"){

      osc.frequency.value=90;

    }

    gain.gain.setValueAtTime(
      .18,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .01,
      audioCtx.currentTime+.45
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime+.45
    );

  }catch(e){}

}


/* =========================
   SHOOT
========================= */

function shoot(){

  if(shooting)return;

  shooting=true;

  dragging=false;

  clearInterval(powerTimer);

  shootButton.disabled=true;

  sound("kick");


  if(navigator.vibrate){

    navigator.vibrate(30);

  }


  let direction;

  if(aimX<35){

    direction="left";

  }else if(aimX>65){

    direction="right";

  }else{

    direction="center";

  }


  /*
    Goalkeeper AI
  */

  const choices=[
    "left",
    "center",
    "right"
  ];

  let keeperDirection=
    choices[
      Math.floor(
        Math.random()*3
      )
    ];


  /*
    Keeper sometimes predicts
    the player's target.
  */

  if(Math.random()<.42){

    keeperDirection=
      direction;

  }


  keeper.className="keeper";


  if(keeperDirection==="left"){

    keeper.classList.add(
      "diveLeft"
    );

  }

  if(keeperDirection==="right"){

    keeper.classList.add(
      "diveRight"
    );

  }

  if(keeperDirection==="center"){

    keeper.classList.add(
      "diveCenter"
    );

  }


  /*
    Move ball toward
    selected target.
  */

  const finalLeft=
    50+(aimX-50)*.75;

  const finalBottom=
    300+(100-aimY)*1.25;


  ball.style.left=
    finalLeft+"%";

  ball.style.bottom=
    finalBottom+"px";


  ball.style.transform=
    "translateX(-50%) rotate(720deg) scale("+
    (.55+power/500)+")";


  setTimeout(()=>{

    let saved=
      direction===keeperDirection;


    /*
      Powerful corner shots
      can beat the keeper.
    */

    const corner=
      aimX<20 ||
      aimX>80 ||
      aimY<18;


    if(
      saved &&
      corner &&
      power>75 &&
      Math.random()<.6
    ){

      saved=false;

    }


    /*
      Weak shots are easier
      to save.
    */

    if(
      power<35 &&
      Math.random()<.35
    ){

      saved=true;

    }


    if(saved){

      sound("save");

      showMessage(
        "SAVED!",
        false
      );

      if(navigator.vibrate){

        navigator.vibrate(
          [50,40,80]
        );

      }

    }else{

      score++;

      scoreEl.textContent=
        score;

      sound("goal");

      showMessage(
        "GOAL!",
        true
      );

      if(navigator.vibrate){

        navigator.vibrate(
          [40,40,100]
        );

      }

    }

  },700);


  setTimeout(()=>{

    if(round>=5){

      finish();

    }else{

      nextRound();

    }

  },1800);

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  goal
){

  message.textContent=
    goal
      ? "⚽ "+text
      : "🧤 "+text;

  message.className=
    "message show "+
    (
      goal
      ? "goalMsg"
      : "saveMsg"
    );

}


/* =========================
   NEXT ROUND
========================= */

function nextRound(){

  round++;

  roundEl.textContent=
    round;

  ball.style.left=
    "50%";

  ball.style.bottom=
    "125px";

  ball.style.transform=
    "translateX(-50%)";


  keeper.className=
    "keeper";


  message.className=
    "message";


  aimX=50;
  aimY=50;


  crosshair.style.left=
    "50%";

  crosshair.style.top=
    "50%";


  power=60;
  powerDirection=1;

  powerFill.style.width=
    "60%";


  shooting=false;

  shootButton.disabled=
    false;


  startPower();

}


/* =========================
   FINISH
========================= */

function finish(){

  clearInterval(powerTimer);

  finalScore.textContent=
    score;


  if(score===5){

    resultText.textContent=
      "PERFECT SHOOTOUT. Five penalties. Five goals.";

  }else if(score>=3){

    resultText.textContent=
      "A strong penalty performance. The goalkeeper had a difficult night.";

  }else if(score>0){

    resultText.textContent=
      "You found the net, but the goalkeeper made some important saves.";

  }else{

    resultText.textContent=
      "The goalkeeper wins this shootout. Step up again.";

  }


  result.classList.add("show");

}


/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

  result.classList.remove(
    "show"
  );

  reset();

  startPower();

}


/* =========================
   RESET
========================= */

function reset(){

  score=0;
  round=1;

  power=60;
  powerDirection=1;

  shooting=false;

  scoreEl.textContent=
    "0";

  roundEl.textContent=
    "1";


  powerFill.style.width=
    "60%";


  ball.style.left=
    "50%";

  ball.style.bottom=
    "125px";

  ball.style.transform=
    "translateX(-50%)";


  keeper.className=
    "keeper";


  message.className=
    "message";


  aimX=50;
  aimY=50;


  crosshair.style.left=
    "50%";

  crosshair.style.top=
    "50%";


  shootButton.disabled=
    false;

}

</script>
