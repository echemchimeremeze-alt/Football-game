<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DEBRYNE PENALTY V4</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#020604;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

.game{
    width:100%;
    max-width:520px;
    height:100vh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#075d29;
}

/* START */

.start{
    position:absolute;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;

    background:
    linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.88)),
    radial-gradient(circle at 50% 30%,#168f45,#03160a);
}

.startBox{
    width:100%;
    max-width:390px;
}

.logo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:2px;
}

.logo span{
    color:#ffd21a;
}

.v4{
    color:#aaa;
    font-size:11px;
    letter-spacing:4px;
    margin-top:7px;
}

.startBox h2{
    margin-top:40px;
    font-size:22px;
}

.startBox p{
    color:#bbb;
    font-size:13px;
    line-height:1.6;
    margin:12px 0 22px;
}

.difficulty{
    display:flex;
    gap:7px;
    margin-bottom:17px;
}

.diff{
    flex:1;
    padding:12px 4px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.25);
    background:#18241d;
    color:white;
    font-weight:bold;
}

.diff.active{
    background:#ffd21a;
    color:#111;
}

.startBtn{
    width:100%;
    border:0;
    padding:17px;
    border-radius:13px;
    background:#ffd21a;
    color:#111;
    font-size:18px;
    font-weight:900;
    box-shadow:0 5px 0 #9c7b00;
}

/* HEADER */

.header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:70px;
    z-index:50;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 16px;

    background:rgba(0,0,0,.47);
}

.brand{
    font-weight:900;
    font-size:17px;
}

.brand span{
    color:#ffd21a;
}

.stats{
    display:flex;
    gap:18px;
    text-align:center;
}

.stat small{
    display:block;
    color:#aaa;
    font-size:8px;
}

.stat strong{
    font-size:20px;
}

/* STADIUM */

.stadium{
    position:absolute;
    inset:0;
    padding-top:70px;

    background:
    linear-gradient(
        to bottom,
        #26322c 0,
        #111913 18%,
        #08732f 40%,
        #064d23 100%
    );
}

.crowd{
    position:absolute;
    top:70px;
    width:100%;
    height:110px;

    background:
    radial-gradient(circle,#aaa 1px,transparent 2px),
    radial-gradient(circle,#555 1px,transparent 2px),
    #18211c;

    background-size:13px 13px,17px 17px;
}

.field{
    position:absolute;
    top:180px;
    bottom:0;
    width:100%;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 45px,
        transparent 45px,
        transparent 90px
    ),
    linear-gradient(#08772f,#064d23);
}

/* GOAL */

.goal{
    position:absolute;
    top:108px;
    left:50%;
    transform:translateX(-50%);

    width:315px;
    height:195px;

    border:7px solid white;
    border-bottom:0;

    background:
    repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 23px,
        rgba(255,255,255,.24) 24px,
        transparent 25px
    ),
    repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 23px,
        rgba(255,255,255,.24) 24px,
        transparent 25px
    );

    box-shadow:0 10px 30px rgba(0,0,0,.45);

    z-index:5;
}

/* TARGET */

.targetArea{
    position:absolute;
    top:115px;
    left:50%;
    transform:translateX(-50%);

    width:295px;
    height:175px;

    z-index:10;

    border:1px dashed rgba(255,255,255,.28);
}

.aimPoint{
    position:absolute;

    width:30px;
    height:30px;

    border:3px solid #ffd21a;
    border-radius:50%;

    transform:translate(-50%,-50%);

    box-shadow:0 0 12px rgba(255,210,26,.8);

    pointer-events:none;

    transition:left .08s,top .08s;
}

.aimPoint:after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ffd21a;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* KEEPER */

.keeper{
    position:absolute;

    top:150px;
    left:50%;

    width:72px;
    height:125px;

    transform:translateX(-50%);

    z-index:15;

    transition:
    transform .55s cubic-bezier(.2,.8,.2,1);
}

.head{
    width:30px;
    height:30px;
    margin:auto;
    border-radius:50%;
    background:#8d5524;
}

.body{
    width:50px;
    height:57px;
    margin:auto;
    background:#1264ce;
    border-radius:12px 12px 6px 6px;
}

.arm{
    position:absolute;
    top:31px;
    width:16px;
    height:55px;
    background:#1264ce;
    border-radius:12px;
}

.arm.left{
    left:2px;
    transform:rotate(24deg);
}

.arm.right{
    right:2px;
    transform:rotate(-24deg);
}

.leg{
    position:absolute;
    top:83px;
    width:17px;
    height:43px;
    background:#111;
    border-radius:10px;
}

.leg.left{
    left:18px;
}

.leg.right{
    right:18px;
}

.keeper.diveLeft{
    transform:translateX(-135px) rotate(-40deg);
}

.keeper.diveRight{
    transform:translateX(65px) rotate(40deg);
}

.keeper.diveCenter{
    transform:translateX(-50%) scale(1.12);
}

/* BALL */

.ball{
    position:absolute;

    width:50px;
    height:50px;

    left:50%;
    bottom:150px;

    transform:translateX(-50%);

    z-index:25;

    transition:
    left .65s cubic-bezier(.15,.8,.2,1),
    bottom .65s cubic-bezier(.15,.8,.2,1),
    transform .65s;
}

.ball:after{
    content:"⚽";
    font-size:50px;
    line-height:50px;
}

/* INSTRUCTIONS */

.instruction{
    position:absolute;
    top:320px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:#ddd;
    z-index:30;
}

/* POWER */

.power{
    position:absolute;
    bottom:175px;
    left:50%;
    transform:translateX(-50%);
    width:250px;
    z-index:35;
}

.powerTitle{
    text-align:center;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.powerBar{
    width:100%;
    height:14px;
    border-radius:20px;
    background:#181818;
    border:1px solid rgba(255,255,255,.4);
    overflow:hidden;
}

.powerFill{
    width:60%;
    height:100%;
    background:#ffd21a;
}

/* SHOOT */

.shoot{
    position:absolute;

    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:220px;
    padding:16px;

    border:0;
    border-radius:14px;

    background:#ffd21a;
    color:#111;

    font-size:17px;
    font-weight:900;

    z-index:40;

    box-shadow:0 5px 0 #a07d00;
}

.shoot:disabled{
    opacity:.5;
}

/* MESSAGE */

.message{
    position:absolute;

    top:350px;
    left:50%;
    transform:translateX(-50%);

    z-index:70;

    font-size:34px;
    font-weight:1000;

    text-shadow:0 4px 10px #000;

    opacity:0;

    transition:.2s;
}

.message.show{
    opacity:1;
}

.goalMsg{
    color:#00ff69;
}

.saveMsg{
    color:#ff4141;
}

/* RESULT */

.result{
    position:absolute;
    inset:0;
    z-index:300;

    display:none;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.88);
    text-align:center;
}

.result.show{
    display:flex;
}

.resultBox{
    width:100%;
    max-width:360px;

    background:#102019;
    border:1px solid rgba(255,255,255,.16);

    border-radius:22px;
    padding:30px 25px;
}

.resultBox h1{
    font-size:27px;
}

.finalScore{
    font-size:58px;
    font-weight:1000;
    color:#ffd21a;
    margin:17px 0;
}

.best{
    color:#aaa;
    margin-bottom:9px;
}

.resultText{
    color:#bbb;
    margin-bottom:22px;
}

.again{
    width:100%;
    border:0;
    padding:16px;
    border-radius:12px;
    background:#ffd21a;
    color:#111;
    font-weight:900;
    font-size:16px;
}

@media(max-height:650px){

    .goal{
        top:92px;
        height:160px;
    }

    .targetArea{
        top:99px;
        height:145px;
    }

    .keeper{
        top:130px;
    }

    .aimPoint{
        width:27px;
        height:27px;
    }

    .instruction{
        top:285px;
    }

    .power{
        bottom:145px;
    }

    .shoot{
        bottom:15px;
    }

    .ball{
        bottom:130px;
    }
}
</style>
</head>

<body>

<div class="game">

<!-- START -->

<div class="start" id="startScreen">

    <div class="startBox">

        <div class="logo">
            DEBRYNE <span>PENALTY</span>
        </div>

        <div class="v4">
            V4 • MOBILE SHOOTOUT
        </div>

        <h2>⚽ Beat the goalkeeper</h2>

        <p>
            Drag the target around the goal to aim.
            Watch the power meter and tap SHOOT.
        </p>

        <div class="difficulty">

            <button class="diff"
                id="easy"
                onclick="setDifficulty('easy')">
                EASY
            </button>

            <button class="diff active"
                id="normal"
                onclick="setDifficulty('normal')">
                NORMAL
            </button>

            <button class="diff"
                id="hard"
                onclick="setDifficulty('hard')">
                HARD
            </button>

        </div>

        <button
            class="startBtn"
            onclick="startGame()">
            START SHOOTOUT
        </button>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <div class="brand">
        DEBRYNE <span>PENALTY</span>
    </div>

    <div class="stats">

        <div class="stat">
            <small>GOALS</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>ROUND</small>
            <strong>
                <span id="round">1</span>/5
            </strong>
        </div>

        <div class="stat">
            <small>BEST</small>
            <strong id="best">0</strong>
        </div>

    </div>

</div>


<!-- STADIUM -->

<div class="stadium">

    <div class="crowd"></div>

    <div class="field"></div>

    <div class="goal"></div>


    <!-- AIMING AREA -->

    <div
        class="targetArea"
        id="targetArea">

        <div
            class="aimPoint"
            id="aimPoint">
        </div>

    </div>


    <!-- KEEPER -->

    <div
        class="keeper"
        id="keeper">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>


    <!-- BALL -->

    <div
        class="ball"
        id="ball">
    </div>


    <div
        class="instruction"
        id="instruction">

        DRAG THE TARGET • THEN SHOOT

    </div>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message">
    </div>


    <!-- POWER -->

    <div class="power">

        <div class="powerTitle">
            SHOOTING POWER
        </div>

        <div class="powerBar">

            <div
                class="powerFill"
                id="powerFill">
            </div>

        </div>

    </div>


    <!-- SHOOT BUTTON -->

    <button
        class="shoot"
        id="shootButton"
        onclick="shoot()">

        ⚡ SHOOT

    </button>

</div>


<!-- RESULT -->

<div
    class="result"
    id="result">

    <div class="resultBox">

        <h1>
            🏆 SHOOTOUT COMPLETE
        </h1>

        <div class="finalScore">
            <span id="finalScore">0</span>/5
        </div>

        <div class="best">
            BEST SCORE:
            <strong id="resultBest">0</strong>/5
        </div>

        <div
            class="resultText"
            id="resultText">
        </div>

        <button
            class="again"
            onclick="playAgain()">

            PLAY AGAIN

        </button>

    </div>

</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let score = 0;
let round = 1;

let difficulty = "normal";

let shooting = false;

let power = 60;
let powerDirection = 1;

let powerTimer;

let aimX = 50;
let aimY = 50;

let dragging = false;


/* =========================
   ELEMENTS
========================= */

const startScreen =
document.getElementById("startScreen");

const targetArea =
document.getElementById("targetArea");

const aimPoint =
document.getElementById("aimPoint");

const keeper =
document.getElementById("keeper");

const ball =
document.getElementById("ball");

const message =
document.getElementById("message");

const powerFill =
document.getElementById("powerFill");

const shootButton =
document.getElementById("shootButton");

const scoreDisplay =
document.getElementById("score");

const roundDisplay =
document.getElementById("round");

const bestDisplay =
document.getElementById("best");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const resultBest =
document.getElementById("resultBest");

const resultText =
document.getElementById("resultText");


/* =========================
   BEST SCORE
========================= */

let bestScore =
Number(localStorage.getItem("debrynePenaltyBest") || 0);

bestDisplay.textContent =
bestScore;


/* =========================
   DIFFICULTY
========================= */

function setDifficulty(level){

    difficulty = level;

    document
    .querySelectorAll(".diff")
    .forEach(button => {
        button.classList.remove("active");
    });

    document
    .getElementById(level)
    .classList.add("active");
}


/* =========================
   START
========================= */

function startGame(){

    startScreen.style.display = "none";

    resetGame();

    startPower();

}


/* =========================
   POWER
========================= */

function startPower(){

    clearInterval(powerTimer);

    powerTimer = setInterval(() => {

        power += powerDirection * 2;

        if(power >= 100){

            power = 100;
            powerDirection = -1;

        }

        if(power <= 20){

            power = 20;
            powerDirection = 1;

        }

        powerFill.style.width =
        power + "%";

    },40);

}


/* =========================
   AIM POSITION
========================= */

function updateAim(x,y){

    const rect =
    targetArea.getBoundingClientRect();

    let localX =
    ((x - rect.left) / rect.width) * 100;

    let localY =
    ((y - rect.top) / rect.height) * 100;


    /*
       Keep the target inside
       the goal.
    */

    localX =
    Math.max(7,Math.min(93,localX));

    localY =
    Math.max(8,Math.min(92,localY));


    aimX = localX;
    aimY = localY;


    aimPoint.style.left =
    localX + "%";

    aimPoint.style.top =
    localY + "%";
}


/* =========================
   TOUCH AIMING
========================= */

targetArea.addEventListener(
    "touchstart",
    function(e){

        if(shooting) return;

        dragging = true;

        const touch =
        e.touches[0];

        updateAim(
            touch.clientX,
            touch.clientY
        );

    },
    {passive:false}
);


targetArea.addEventListener(
    "touchmove",
    function(e){

        if(!dragging || shooting)
            return;

        e.preventDefault();

        const touch =
        e.touches[0];

        updateAim(
            touch.clientX,
            touch.clientY
        );

    },
    {passive:false}
);


targetArea.addEventListener(
    "touchend",
    function(){

        dragging = false;

    }
);


/* =========================
   MOUSE AIMING
========================= */

targetArea.addEventListener(
    "mousedown",
    function(e){

        if(shooting) return;

        dragging = true;

        updateAim(
            e.clientX,
            e.clientY
        );

    }
);

document.addEventListener(
    "mousemove",
    function(e){

        if(!dragging || shooting)
            return;

        updateAim(
            e.clientX,
            e.clientY
        );

    }
);

document.addEventListener(
    "mouseup",
    function(){

        dragging = false;

    }
);


/* =========================
   SOUND ENGINE
========================= */

let audioContext;

function audio(){

    if(!audioContext){

        audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }
}


function sound(type){

    try{

        audio();

        const oscillator =
        audioContext.createOscillator();

        const gain =
        audioContext.createGain();

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        if(type === "kick"){

            oscillator.frequency.value = 100;

            gain.gain.setValueAtTime(
                .18,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .01,
                audioContext.currentTime + .18
            );

        }


        if(type === "goal"){

            oscillator.frequency.value = 520;

            gain.gain.setValueAtTime(
                .18,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .01,
                audioContext.currentTime + .5
            );

        }


        if(type === "save"){

            oscillator.frequency.value = 120;

            gain.gain.setValueAtTime(
                .18,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .01,
                audioContext.currentTime + .35
            );

        }


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .55
        );

    }catch(e){

        /* Sound is optional */

    }
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(shooting) return;

    shooting = true;

    dragging = false;

    clearInterval(powerTimer);

    shootButton.disabled = true;

    sound("kick");


    if(navigator.vibrate){

        navigator.vibrate(30);

    }


    /*
       Convert aim position
       into a direction.
    */

    let direction;

    if(aimX < 35){

        direction = "left";

    }else if(aimX > 65){

        direction = "right";

    }else{

        direction = "center";

    }


    /*
       Goalkeeper AI
    */

    const directions =
    ["left","center","right"];

    let keeperDirection;


    if(difficulty === "easy"){

        if(Math.random() < .35){

            keeperDirection =
            directions[
                Math.floor(
                    Math.random()*3
                )
            ];

        }else{

            keeperDirection =
            directions[
                Math.floor(
                    Math.random()*3
                )
            ];

        }

    }


    if(difficulty === "normal"){

        keeperDirection =
        directions[
            Math.floor(
                Math.random()*3
            )
        ];

    }


    if(difficulty === "hard"){

        if(Math.random() < .48){

            keeperDirection =
            direction;

        }else{

            keeperDirection =
            directions[
                Math.floor(
                    Math.random()*3
                )
            ];

        }

    }


    /* Keeper animation */

    keeper.className = "keeper";

    if(keeperDirection === "left"){

        keeper.classList.add("diveLeft");

    }

    if(keeperDirection === "right"){

        keeper.classList.add("diveRight");

    }

    if(keeperDirection === "center"){

        keeper.classList.add("diveCenter");

    }


    /*
       Ball target.

       The ball uses the actual
       position of the aim marker.
    */

    const targetLeft =
    50 + (aimX - 50) * .72;

    const targetBottom =
    300 + (100 - aimY) * 1.25;


    ball.style.left =
    targetLeft + "%";

    ball.style.bottom =
    targetBottom + "px";


    /*
       Power changes the scale.
    */

    const ballScale =
    .48 + (power / 100) * .22;


    ball.style.transform =
    "translateX(-50%) scale(" +
    ballScale +
    ") rotate(720deg)";


    setTimeout(() => {

        /*
           Distance from the
           goalkeeper's likely zone.
        */

        let saved =
        direction === keeperDirection;


        /*
           Very accurate corner shots
           are harder to save.
        */

        const cornerShot =
        aimX < 20 ||
        aimX > 80 ||
        aimY < 20;


        if(
            saved &&
            cornerShot &&
            power >= 70 &&
            Math.random() < .55
        ){

            saved = false;

        }


        /*
           Very weak shots are easier
           to save.
        */

        if(
            power < 30 &&
            Math.random() < .35
        ){

            saved = true;

        }


        if(saved){

            sound("save");

            if(navigator.vibrate){

                navigator.vibrate(
                    [50,40,80]
                );

            }

            showMessage(
                "🧤 SAVED!",
                false
            );

        }else{

            score++;

            scoreDisplay.textContent =
            score;

            sound("goal");

            if(navigator.vibrate){

                navigator.vibrate(
                    [40,50,100]
                );

            }

            showMessage(
                "⚽ GOAL!",
                true
            );

        }

    },650);


    setTimeout(() => {

        if(round >= 5){

            finishGame();

        }else{

            nextRound();

        }

    },1700);

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,isGoal){

    message.textContent =
    text;

    message.className =
    "message show " +
    (isGoal
        ? "goalMsg"
        : "saveMsg");

}


/* =========================
   NEXT ROUND
========================= */

function nextRound(){

    round++;

    roundDisplay.textContent =
    round;


    ball.style.left =
    "50%";

    ball.style.bottom =
    "150px";

    ball.style.transform =
    "translateX(-50%)";


    keeper.className =
    "keeper";

    message.className =
    "message";


    aimX = 50;
    aimY = 50;


    aimPoint.style.left =
    "50%";

    aimPoint.style.top =
    "50%";


    power = 60;

    powerDirection = 1;

    powerFill.style.width =
    "60%";


    shooting = false;

    shootButton.disabled =
    false;


    startPower();

}


/* =========================
   FINISH
========================= */

function finishGame(){

    clearInterval(powerTimer);

    finalScore.textContent =
    score;


    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "debrynePenaltyBest",
            bestScore
        );

    }


    bestDisplay.textContent =
    bestScore;

    resultBest.textContent =
    bestScore;


    if(score === 5){

        resultText.textContent =
        "🔥 PERFECT SHOOTOUT! Every penalty found the net.";

    }else if(score >= 3){

        resultText.textContent =
        "⚽ Excellent shooting. You beat the goalkeeper.";

    }else if(score > 0){

        resultText.textContent =
        "👏 You found the net, but the goalkeeper made some saves.";

    }else{

        resultText.textContent =
        "🧤 The goalkeeper had the final word this time.";

    }


    result.classList.add("show");

}


/* =========================
   PLAY AGAIN
========================= */

function playAgain(){

    result.classList.remove("show");

    resetGame();

    startPower();

}


/* =========================
   RESET
========================= */

function resetGame(){

    score = 0;

    round = 1;

    power = 60;

    powerDirection = 1;

    shooting = false;

    aimX = 50;
    aimY = 50;


    scoreDisplay.textContent =
    "0";

    roundDisplay.textContent =
    "1";


    powerFill.style.width =
    "60%";


    aimPoint.style.left =
    "50%";

    aimPoint.style.top =
    "50%";


    ball.style.left =
    "50%";

    ball.style.bottom =
    "150px";

    ball.style.transform =
    "translateX(-50%)";


    keeper.className =
    "keeper";

    message.className =
    "message";


    shootButton.disabled =
    false;

}

</script>

</body>
</html>
